stages:
  - test

variables:
  GAUGE_HOME: "C:/Users/RAMI/.gauge"

test_job:
  stage: test
  script:
    - gauge install java
    - 'mvn gauge:execute -Dheadless=true "-Dbase.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login"'
  tags:
    - local-windows
  artifacts:
    when: always
    paths:
      - reports/html-report/
      - .gauge/screenshots/
    expire_in: 30 days