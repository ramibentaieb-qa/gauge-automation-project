
name: Gauge Selenium CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Google Chrome and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Setup Gauge
        uses: getgauge/setup-gauge@master
        with:
          gauge-version: "1.6.7"
          gauge-plugins: java, html-report, screenshot
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Gauge installation
        run: |
          gauge version
          gauge install java
          gauge version

      - name: Run Gauge Tests
        run: |
          xvfb-run -a mvn gauge:execute \
            -Dbase.url="https://practicesoftwaretesting.com/auth/login"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauge-reports
          path: |
            reports/html-report/
            .gauge/screenshots/
          if-no-files-found: warn
          retention-days: 30