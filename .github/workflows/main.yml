name: Gauge Selenium CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install Gauge CLI
      run: |
        curl -SsL https://downloads.getgauge.io/stable | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Run Gauge Tests
      run: mvn gauge:execute

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gauge-reports
        path: target/gauge-results/
        retention-days: 30